<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#07070c" />
  <title>CMS — AABIR AHAMMED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#07070c; --panel:#0d0d14; --ink:#f4f4f8; --muted:#9a9ab0;
      --line:rgba(255,255,255,.08);
      --a1:#ff3d81; --a2:#22d3ee; --ok:#a3e635; --bad:#ff3d5e;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:var(--bg); color:var(--ink);
      font-family:'Inter',sans-serif; min-height:100vh; padding:26px 20px 90px;
      background-image:radial-gradient(1000px 500px at 80% -10%, rgba(255,61,129,.07), transparent 60%),
                       radial-gradient(800px 400px at 10% 110%, rgba(34,211,238,.06), transparent 60%);
    }
    ::selection{background:rgba(255,61,129,.35)}
    .wrap{max-width:980px;margin:0 auto}

    /* ---------- header ---------- */
    .top{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
    .brand{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:.03em}
    .brand span{color:var(--a1)}
    .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--muted);
      border:1px solid var(--line);border-radius:20px;padding:4px 10px}
    .spacer{flex:1}
    .toplink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);
      border-radius:8px;padding:7px 12px;transition:color .2s,border-color .2s}
    .toplink:hover{color:var(--ink);border-color:var(--a1)}
    .lede{color:var(--muted);font-size:12.5px;margin-bottom:22px}
    .lede b{color:var(--a2);font-weight:600}

    /* ---------- login ---------- */
    #gate{max-width:380px;margin:14vh auto 0;text-align:center;
      background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 30px}
    #gate h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:.02em;margin-bottom:6px}
    #gate p{color:var(--muted);font-size:12px;margin-bottom:20px}
    #pass{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;
      color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:13px;padding:11px 13px;
      text-align:center;letter-spacing:.2em}
    #pass:focus{outline:none;border-color:var(--a1)}
    #gateBtn{margin-top:14px;width:100%;padding:11px;border:none;border-radius:9px;cursor:pointer;
      font-family:'Syne',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.06em;
      color:#0b0b12;background:linear-gradient(90deg,var(--a1),var(--a2))}
    #gateMsg{font-size:12px;color:var(--bad);margin-top:12px;min-height:16px}

    /* ---------- toolbar ---------- */
    .bar{display:flex;align-items:center;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;
      font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;
      padding:9px 16px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
    .btn:hover{color:var(--ink);border-color:var(--a2)}
    .btn.primary{background:linear-gradient(90deg,var(--a1),var(--a2));color:#0b0b12;border:none}
    .btn.primary:hover{filter:brightness(1.1);color:#0b0b12}

    /* ---------- cards ---------- */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
      padding:16px 18px;margin-bottom:12px}
    .card.dirty{border-color:rgba(255,61,129,.5)}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .row + .row{margin-top:10px}
    .f{display:flex;flex-direction:column;gap:4px}
    .f label{font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
    .f input{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;
      color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;padding:8px 10px;
      transition:border-color .2s}
    .f input:focus{outline:none;border-color:var(--a1)}
    .f input.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
    .f-title{flex:1 1 240px}
    .f-client{flex:1 1 160px}
    .f-meta{flex:1 1 140px}
    .f-year,.f-sort{width:76px}
    .f input[type=number]{font-family:'JetBrains Mono',monospace}
    .f input[type=color]{width:44px;height:32px;padding:2px 3px;cursor:pointer;background:none}
    .swatch{width:64px;height:32px;border-radius:8px;border:1px solid var(--line);flex:none}
    .livebox{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
    .livebox input{width:16px;height:16px;accent-color:var(--a2);cursor:pointer}
    .livebox span{font-size:10px;letter-spacing:.14em;color:var(--muted)}
    .card .acts{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
    .mini{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;
      font-size:11px;font-family:'Syne',sans-serif;font-weight:700;padding:6px 12px;cursor:pointer;
      transition:color .2s,border-color .2s,background .2s}
    .mini:hover{color:var(--ink);border-color:var(--a2)}
    .mini.save{color:#0b0b12;background:linear-gradient(90deg,var(--a1),var(--a2));border:none;min-width:74px}
    .mini.save:disabled{opacity:.55;cursor:wait}
    .mini.del:hover{color:var(--bad);border-color:var(--bad)}
    .mini.del.arm{color:var(--bad);border-color:var(--bad);background:rgba(255,61,94,.12)}
    .ghostnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);opacity:.7;margin-left:auto}

    /* ---------- top bar + pages grid ---------- */
    .cbar{display:flex;align-items:center;gap:12px;margin:4px 0 20px;flex-wrap:wrap}
    .crumb{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;
      font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;
      padding:8px 14px;cursor:pointer;transition:color .2s,border-color .2s}
    .crumb:hover{color:var(--ink);border-color:var(--a2)}
    .where{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:.05em}
    .where i{color:var(--a1);font-style:normal}
    .spacer{flex:1}
    .pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
    .pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:26px 22px 22px;cursor:pointer;overflow:hidden;
      transition:border-color .2s,transform .18s,box-shadow .2s}
    .pcard:hover{border-color:var(--a2);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.45)}
    .pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--a1),var(--a2));opacity:0;transition:opacity .2s}
    .pcard:hover::before{opacity:1}
    .pcard .pname{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;letter-spacing:.03em;margin-bottom:7px}
    .pcard .pdesc{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:16px}
    .pcard .pcount{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted)}
    .pcard .go{position:absolute;top:18px;right:18px;color:var(--muted);font-size:17px;transition:transform .18s,color .2s}
    .pcard:hover .go{transform:translateX(3px);color:var(--a2)}
    .pcard .nd{display:none;width:9px;height:9px;border-radius:50%;background:var(--a1);
      position:absolute;top:14px;right:38px;box-shadow:0 0 8px rgba(255,61,129,.9)}
    .pcard.has-dirty .nd{display:block}

    /* ---------- sections + fields (matches project cards) ---------- */
    .sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:20px 22px 22px;margin-bottom:14px}
    .sec-h{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;letter-spacing:.2em;
      color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:4px}
    .sec-h::before{content:"";width:26px;height:3px;border-radius:2px;flex:none;
      background:linear-gradient(90deg,var(--a1),var(--a2))}
    .sec-h .gcount{font-size:9.5px;color:var(--muted);opacity:.7;letter-spacing:.1em;font-weight:600}
    .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:14px}
    .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
    .fld.wide{grid-column:1/-1}
    .fld label{font-size:9.5px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;
      display:flex;justify-content:space-between;gap:8px}
    .fld label .hint{color:rgba(154,154,176,.55);text-transform:none;letter-spacing:.04em}
    .fld input,.fld textarea{
      background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;
      color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;padding:10px 12px;
      transition:border-color .2s,background .2s;width:100%;resize:vertical}
    .fld textarea{min-height:76px;line-height:1.55}
    .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--a1);background:rgba(255,255,255,.06)}
    .fld.dirty input,.fld.dirty textarea{border-color:rgba(255,61,129,.55)}
    .subblock{border:1px dashed var(--line);border-radius:11px;padding:14px 16px 16px;margin-bottom:14px}
    .fgrid .subblock{margin-bottom:0;grid-column:1/-1}
    .subblock:last-child{margin-bottom:0}
    .subblock h4{font-family:'Syne',sans-serif;font-weight:700;font-size:10px;letter-spacing:.16em;
      color:var(--a1);margin-bottom:2px}
    .chint{font-size:11px;color:var(--muted);margin:0;line-height:1.5}
    .chint b{color:var(--a2);font-weight:600}

    /* ---------- projects section (inside Work) ---------- */
    .proj-bar{display:flex;align-items:center;gap:12px;margin-top:14px}
    .mini{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;
      font-size:11px;font-family:'Syne',sans-serif;font-weight:700;padding:6px 12px;cursor:pointer;
      transition:color .2s,border-color .2s,background .2s}
    .mini:hover{color:var(--ink);border-color:var(--a2)}
    .mini.save{color:#0b0b12;background:linear-gradient(90deg,var(--a1),var(--a2));border:none;min-width:74px}
    .mini.save:disabled{opacity:.55;cursor:wait}
    .mini.del:hover{color:var(--bad);border-color:var(--bad)}
    .mini.del.arm{color:var(--bad);border-color:var(--bad);background:rgba(255,61,94,.12)}
    .ghostnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);opacity:.7}

    /* ---------- toast ---------- */
    #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);
      background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:11px 18px;font-size:12.5px;transition:transform .25s ease;z-index:50}
    #toast.show{transform:translate(-50%,0)}
    #toast.ok{color:var(--ok);border-color:rgba(163,230,53,.35)}
    #toast.bad{color:var(--bad);border-color:rgba(255,61,94,.35)}
    #toast.busy{color:var(--muted)}

    @media (max-width:560px){
      body{padding:18px 12px 90px}
      .f-year,.f-sort{width:64px}
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="top">
      <div class="brand">AABIR AHAMMED <span>/ CMS</span></div>
      <span class="tag">PROJECTS TABLE</span>
      <div class="spacer"></div>
      <a class="toplink" href="index.html">← Back to site</a>
      <button class="toplink" id="signout" type="button">Sign out</button>
    </div>
    <p class="lede">Edit the Work-page carousel live. Changes appear on the site the next time a visitor loads <b>work.html</b>. No deploy needed.</p>

    <div id="gate">
      <h1>STUDIO ACCESS</h1>
      <p>Enter your CMS password to manage projects.</p>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      <button id="gateBtn" type="button">Unlock</button>
      <p id="gateMsg"></p>
    </div>

    <div id="app" hidden>
      <div class="cbar">
        <button class="crumb" id="backBtn" type="button" hidden>← All pages</button>
        <span class="where" id="where"></span>
        <div class="spacer"></div>
        <span class="chint" id="saveHint">Edits are marked — save when ready</span>
        <button class="btn primary" id="saveContentBtn" type="button" disabled>Save content</button>
        <button class="btn" id="reloadBtn" type="button">↻ Reload</button>
      </div>
      <div class="pages-grid" id="pagesGrid"></div>
      <div id="pageEdit" hidden></div>
    </div>

  </div>
  <div id="toast"></div>

  <script src="js/content.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
